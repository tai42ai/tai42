[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tai-e2e-market-theta"
version = "0.0.0"
description = "Installable marketplace fixture plugin: an HTTP router whose declared route shape-collides with epsilon's."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "tai42-contract>=0.4,<0.5",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tai_e2e_market_theta*"]

[tool.setuptools.package-data]
tai_e2e_market_theta = ["tai-plugin.yml", "docs/index.mdx"]
