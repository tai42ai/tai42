[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tai-e2e-market-pi"
version = "0.0.0"
description = "Installable marketplace fixture plugin: an mcp-server item whose server env reads the lambda fixture's recycle-class key."
requires-python = ">=3.13"
license = "Apache-2.0"

[project.scripts]
tai-e2e-market-pi-mcp = "tai_e2e_market_pi.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tai_e2e_market_pi*"]

[tool.setuptools.package-data]
tai_e2e_market_pi = ["tai-plugin.yml", "docs/index.mdx"]
