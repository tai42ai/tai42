[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tai-e2e-market-lambda"
version = "0.0.0"
description = "Installable marketplace fixture plugin: a probe tool over a recycle-class settings group."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "tai42-contract>=0.3,<0.4",
    "tai42-kit",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tai_e2e_market_lambda*"]

[tool.setuptools.package-data]
tai_e2e_market_lambda = ["tai-plugin.yml", "docs/index.mdx"]
