[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tai-e2e-market-zeta"
version = "0.0.0"
description = "Installable marketplace fixture plugin for the plugin-compat specs: a probe tool reporting its own distribution version."
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "tai42-contract>=0.3,<0.4",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tai_e2e_market_zeta*"]

[tool.setuptools.package-data]
tai_e2e_market_zeta = ["tai-plugin.yml", "docs/index.mdx"]
