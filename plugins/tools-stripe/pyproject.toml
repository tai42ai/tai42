[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tai42-tools-stripe"
version = "0.3.8"
description = "Stripe payment tools for the TAI ecosystem: manifest-loaded Checkout Session tools for the external-ask checkout link, the webhook-bridge confirm, the reconciliation recovery layer, and a flexible-amount non-blocking payment link."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "tai42", email = "oss@tai42.ai" },
]
keywords = ["tai", "tools", "stripe", "payments", "checkout"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    # The pure interface contract these tools register through — the tai42_app
    # handle and the tool facet.
    "tai42-contract>=1.3,<2",
    # Leaf helpers: settings machinery (TaiBaseSettings / settings_cache) and the
    # curl client the Stripe REST module wires to.
    "tai42-kit[curl]>=1.2,<2",
    # Imported directly in the settings class: field/secret modelling.
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
]

[project.urls]
Homepage = "https://tai42.ai"
Repository = "https://github.com/tai42ai/tai42/tree/main/plugins/tools-stripe"
Issues = "https://github.com/tai42ai/tai42/issues"
Changelog = "https://github.com/tai42ai/tai42/blob/main/plugins/tools-stripe/CHANGELOG.md"

[project.optional-dependencies]
# Public dev/test tooling.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.389",
    # The plugin-spec test parses tai-plugin.yml.
    "pyyaml>=6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tai42_tools_stripe*"]

[tool.setuptools.package-data]
tai42_tools_stripe = ["py.typed", "tai-plugin.yml"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }]


# The version floors in [project] are the compatibility contract; these sources
# resolve the tai42-* requirements to the in-tree workspace members instead of
# the published packages. They are not part of wheel metadata.
[tool.uv.sources]
tai42-contract = { workspace = true }
tai42-kit = { workspace = true }
[tool.ruff]
src = ["src"]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "PT", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tai42_skeleton".msg = "tai42-tools-stripe is contract-facing: it never imports tai42-skeleton."

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
source = ["tai42_tools_stripe"]

[tool.coverage.report]
fail_under = 95

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
# Basic (not strict) is deliberate: the curl backing dependency (curl-cffi) ships
# no type stubs, so strict is impractical, and reportMissingImports stays a
# warning because pyright cannot resolve the stubless curl-cffi module.
typeCheckingMode = "basic"
reportMissingImports = "warning"
