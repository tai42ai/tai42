spec_version: 1
namespace: tai42
name: tools-stripe
package: tai42-tools-stripe
version: 1.0.3
description: >-
  Stripe payment tools for the TAI ecosystem: manifest-loaded tools for the
  external-ask checkout link, the webhook-bridge confirm, the reconciliation
  recovery layer, a flexible-amount non-blocking payment link, an early expire
  of an issued checkout session, and webhook-endpoint provisioning (create,
  list, delete).
license: Apache-2.0
homepage: https://tai42.ai
repository: https://github.com/tai42ai/tai42/tree/main/plugins/tools-stripe
contract: '>=2.2,<3'
categories:
  - payments
  - utilities
tags:
  - stripe
  - payments
  - checkout
permissions:
  network: true
  subprocess: false
  filesystem: false
provides:
  - kind: tool
    name: confirm_stripe_payment
    module: tai42_tools_stripe.tools.confirm_stripe_payment
    description: Answer a paid checkout ask from a Stripe webhook event.
    tags:
      - stripe
      - payments
    group: payment-confirm
  - kind: tool
    name: create_stripe_checkout
    module: tai42_tools_stripe.tools.create_stripe_checkout
    description: Create a Stripe Checkout Session and return its hosted payment URL.
    tags:
      - stripe
      - payments
    group: payment-sessions
  - kind: tool
    name: create_stripe_payment_link
    module: tai42_tools_stripe.tools.create_stripe_payment_link
    description: >-
      Create a flexible-amount non-blocking Stripe payment link and return its
      URL and session id.
    tags:
      - stripe
      - payments
    group: payment-sessions
  - kind: tool
    name: create_stripe_webhook_endpoint
    module: tai42_tools_stripe.tools.create_stripe_webhook_endpoint
    description: >-
      Create a Stripe webhook endpoint and return its id and one-time signing
      secret.
    tags:
      - stripe
      - payments
    group: webhook-endpoints
  - kind: tool
    name: delete_stripe_webhook_endpoint
    module: tai42_tools_stripe.tools.delete_stripe_webhook_endpoint
    description: Delete a Stripe webhook endpoint by id.
    tags:
      - stripe
      - payments
    group: webhook-endpoints
  - kind: tool
    name: expire_stripe_checkout
    module: tai42_tools_stripe.tools.expire_stripe_checkout
    description: Expire an open Stripe Checkout Session early and return its id and status.
    tags:
      - stripe
      - payments
    group: payment-sessions
  - kind: tool
    name: list_stripe_webhook_endpoints
    module: tai42_tools_stripe.tools.list_stripe_webhook_endpoints
    description: List the account's Stripe webhook endpoints (no signing secrets).
    tags:
      - stripe
      - payments
    group: webhook-endpoints
  - kind: tool
    name: reconcile_stripe_payments
    module: tai42_tools_stripe.tools.reconcile_stripe_payments
    description: Re-answer paid Stripe checkout sessions the webhook path may have lost.
    tags:
      - stripe
      - payments
    group: payment-confirm
