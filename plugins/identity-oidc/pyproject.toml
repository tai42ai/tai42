[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tai42-identity-oidc"
version = "1.0.7"
description = "Validate-only OIDC identity provider for the TAI ecosystem: an installable plugin that registers itself as the \"identity-oidc\" identity provider and resolves an issuer-minted JWT to an authenticated identity (no key minting, no stored state)."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "tai42", email = "oss@tai42.ai" },
]
keywords = ["tai", "identity", "authentication", "oidc", "jwt", "access-control"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    # The pure interface contract the provider registers through — the identity
    # ABCs and the module-level identity-provider registry.
    # Republished for the tai42-contract 5.x major (unified park protocol).
    "tai42-contract>=5.8,<6",
    # The OIDC discovery / JWKS / JWT-verify helper (tai42_kit.net.jwt). The `jwt`
    # extra is REQUIRED, not optional: that module imports joserfc at module top,
    # so tai42-kit[jwt] must resolve for this plugin to import. NO redis extra —
    # this provider validates only and holds no state.
    "tai42-kit[jwt]>=3.8,<4",
]

[project.urls]
Homepage = "https://tai42.ai"
Repository = "https://github.com/tai42ai/tai42/tree/main/plugins/identity-oidc"
Issues = "https://github.com/tai42ai/tai42/issues"
Changelog = "https://github.com/tai42ai/tai42/blob/main/plugins/identity-oidc/CHANGELOG.md"

[project.optional-dependencies]
# Public dev/test tooling.
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.389",
    # The plugin-spec test parses tai-plugin.yml.
    "pyyaml>=6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tai42_identity_oidc*"]

[tool.setuptools.package-data]
tai42_identity_oidc = ["py.typed", "tai-plugin.yml", "docs/*", "docs/images/*"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }]


# The version floors in [project] are the compatibility contract; these sources
# resolve the tai42-* requirements to the in-tree workspace members instead of
# the published packages. They are not part of wheel metadata.
[tool.uv.sources]
tai42-contract = { workspace = true }
tai42-kit = { workspace = true }
[tool.ruff]
src = ["src"]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "PT", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tai42_skeleton".msg = "tai42-identity-oidc is a contract-facing plugin: it never imports tai42-skeleton."

[tool.pytest.ini_options]
# importlib import mode + package-less test dirs (no tests/__init__.py): each test
# module loads under a unique path-derived name, so a whole-repo run collecting
# every member's ``tests`` tree never collides on shared basenames. Intra-suite
# helper imports are relative (``from .conftest``), resolving the same under the
# scoped rootdir here and the repo-root rootdir of a whole-repo run.
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["tai42_identity_oidc"]

[tool.coverage.report]
fail_under = 95

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingImports = "warning"
