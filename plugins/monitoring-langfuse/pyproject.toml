[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tai42-monitoring-langfuse"
version = "1.0.3"
description = "Langfuse monitoring backend for the TAI ecosystem — trace/span emission plus the observability read surface over Langfuse."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "tai42", email = "oss@tai42.ai" },
]
keywords = ["mcp", "monitoring", "observability", "tracing", "langfuse", "tai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    # The pure interface contract the plugin registers through — the Monitoring
    # protocols, the neutral data models, and the tai42_app handle.
    "tai42-contract>=2.3,<3",
    # TaiBaseSettings + the settings cache registry.
    "tai42-kit>=3.4,<4",
    # The Langfuse SDK. Pinned to a minor: sdk_internals.py reaches into private
    # SDK members that have no public equivalent, verified against this version.
    "langfuse~=4.0.6",
    # Required by langfuse.langchain — the CallbackHandler that
    # get_monitoring_callbacks returns (part of the MonitoringWriter contract).
    "langchain>=1.2",
    # The OTel context API used to emit an explicit-time span (record_span).
    "opentelemetry-api>=1.33,<2",
    # SecretStr for the Langfuse secret key and the settings base/config.
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
]

[project.urls]
Homepage = "https://tai42.ai"
Repository = "https://github.com/tai42ai/tai42/tree/main/plugins/monitoring-langfuse"
Issues = "https://github.com/tai42ai/tai42/issues"
Changelog = "https://github.com/tai42ai/tai42/blob/main/plugins/monitoring-langfuse/CHANGELOG.md"

[dependency-groups]
# PEP 735 dev group — installed by default on `uv sync`, so the gate
# `uv sync && uv run pytest && uv run ruff check . && uv run pyright` runs clean.
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.389",
    # The plugin-spec test parses tai-plugin.yml.
    "pyyaml>=6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tai42_monitoring_langfuse*"]

[tool.setuptools.package-data]
tai42_monitoring_langfuse = ["py.typed", "tai-plugin.yml", "docs/*", "docs/images/*"]

[tool.pytest.ini_options]
# importlib import mode + package-less test dirs (no tests/__init__.py): each test
# module loads under a unique path-derived name, so a whole-repo run collecting
# every member's ``tests`` tree never collides on shared basenames. Intra-suite
# helper imports are relative (``from .conftest``), resolving the same under the
# scoped rootdir here and the repo-root rootdir of a whole-repo run.
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
xfail_strict = true
# Turn warnings into errors so a real defect that only surfaces as a warning
# (e.g. a missing await -> "coroutine was never awaited") fails the suite loudly
# instead of passing green.
filterwarnings = ["error"]
markers = [
    "integration: live tests that hit a real Langfuse server (skip cleanly without LANGFUSE_* credentials)",
]

[tool.coverage.run]
source = ["tai42_monitoring_langfuse"]

[tool.coverage.report]
fail_under = 97

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }]


# The version floors in [project] are the compatibility contract; these sources
# resolve the tai42-* requirements to the in-tree workspace members instead of
# the published packages. They are not part of wheel metadata.
[tool.uv.sources]
tai42-contract = { workspace = true }
tai42-kit = { workspace = true }
[tool.ruff]
src = ["src"]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "PT", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tai42_skeleton".msg = "A monitoring plugin sits below the skeleton: it never imports tai42-skeleton."

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
