spec_version: 1
namespace: tai42
name: connector-atlassian
version: 2.0.1
display_name: Atlassian
description: >-
  Atlassian (Jira, Confluence, Compass) OAuth connector provider on Atlassian's
  hosted Rovo MCP endpoint.
icon: >-
  https://raw.githubusercontent.com/tai42ai/tai42/main/plugins/connector-atlassian/icon.png
license: Apache-2.0
homepage: https://tai42.ai
repository: https://github.com/tai42ai/tai42/tree/main/plugins/connector-atlassian
contract: '>=5.11,<6'
categories:
  - connectors
tags:
  - connector
  - oauth
  - atlassian
  - jira
  - confluence
  - compass
permissions:
  network: false
  subprocess: false
  filesystem: false
provides:
  - kind: connector
    name: atlassian
    description: OAuth connector for Atlassian (Jira, Confluence, Compass).
    tags:
      - oauth
      - atlassian
    provider:
      id: atlassian
      kind: oauth
      origin: system
      category: dev-tools
      display_name: Atlassian
      description: Connect Jira, Confluence, and Compass.
      icon_url: >-
        https://raw.githubusercontent.com/tai42ai/tai42/main/plugins/connector-atlassian/icon.png
      oauth:
        authorize: https://auth.atlassian.com/authorize
        token: https://auth.atlassian.com/oauth/token
        revoke: null
      client_id_env: CONNECTORS_ATLASSIAN_CLIENT_ID
      client_secret_env: CONNECTORS_ATLASSIAN_CLIENT_SECRET
      sub_services:
        jira:
          id: jira
          display_name: Jira
          description: >-
            Read and search issues, sprints, and projects; create, update, and
            delete issues; update sprints.
          scopes:
            - offline_access
            - read:issue:jira
            - read:issue-meta:jira
            - read:project:jira
            - read:comment:jira
            - read:attachment:jira
            - read:issue-worklog:jira
            - read:jql:jira
            - read:board-scope:jira-software
            - read:sprint:jira-software
            - write:issue:jira
            - write:comment:jira
            - write:issue-worklog:jira
            - delete:issue:jira
            - write:sprint:jira-software
          mcp_server:
            type: http
            url: https://mcp.atlassian.com/v1/mcp/authv2
        confluence:
          id: confluence
          display_name: Confluence
          description: Read and search pages, spaces, and comments; write pages.
          scopes:
            - offline_access
            - read:page:confluence
            - read:hierarchical-content:confluence
            - read:comment:confluence
            - read:space:confluence
            - write:page:confluence
            - read:content-details:confluence
          mcp_server:
            type: http
            url: https://mcp.atlassian.com/v1/mcp/authv2
        compass:
          id: compass
          display_name: Compass
          description: Read and update components in the service catalog.
          scopes:
            - offline_access
            - read:component:compass
            - write:component:compass
          mcp_server:
            type: http
            url: https://mcp.atlassian.com/v1/mcp/authv2
      extra_authorize_params:
        audience: api.atlassian.com
        prompt: consent
