spec_version: 1
namespace: tai42
name: connector-google
version: 2.0.1
display_name: Google
description: >-
  Google Workspace OAuth connector provider (Gmail, Calendar, Drive, Docs,
  Sheets, Slides, Chat, People) on Google's hosted Workspace MCP servers.
icon: >-
  https://raw.githubusercontent.com/tai42ai/tai42/main/plugins/connector-google/icon.png
license: Apache-2.0
homepage: https://tai42.ai
repository: https://github.com/tai42ai/tai42/tree/main/plugins/connector-google
contract: '>=7.0,<8'
categories:
  - connectors
tags:
  - connector
  - oauth
  - google
  - gmail
  - calendar
  - drive
permissions:
  network: false
  subprocess: false
  filesystem: false
provides:
  - kind: connector
    name: google
    description: OAuth connector for Google Workspace on Google's hosted MCP servers.
    provider:
      id: google
      kind: oauth
      origin: system
      category: communication
      display_name: Google
      description: Connect Gmail, Calendar, Drive, Docs, Sheets, Slides, Chat, and People.
      icon_url: >-
        https://raw.githubusercontent.com/tai42ai/tai42/main/plugins/connector-google/icon.png
      oauth:
        authorize: https://accounts.google.com/o/oauth2/v2/auth
        token: https://oauth2.googleapis.com/token
        revoke: https://oauth2.googleapis.com/revoke
      client_id_env: CONNECTORS_GOOGLE_CLIENT_ID
      client_secret_env: CONNECTORS_GOOGLE_CLIENT_SECRET
      sub_services:
        gmail:
          id: gmail
          display_name: Gmail
          description: List, read, and compose mail.
          scopes:
            - openid
            - email
            - https://www.googleapis.com/auth/gmail.readonly
            - https://www.googleapis.com/auth/gmail.compose
          mcp_server:
            type: http
            url: https://gmailmcp.googleapis.com/mcp/v1
        calendar:
          id: calendar
          display_name: Calendar
          description: Read calendars, events, and free/busy information.
          scopes:
            - openid
            - email
            - https://www.googleapis.com/auth/calendar.calendarlist.readonly
            - https://www.googleapis.com/auth/calendar.events.freebusy
            - https://www.googleapis.com/auth/calendar.events.readonly
          mcp_server:
            type: http
            url: https://calendarmcp.googleapis.com/mcp/v1
        drive:
          id: drive
          display_name: Drive
          description: Browse files (read-only) and create/upload app-scoped files.
          scopes:
            - openid
            - email
            - https://www.googleapis.com/auth/drive.readonly
            - https://www.googleapis.com/auth/drive.file
          mcp_server:
            type: http
            url: https://drivemcp.googleapis.com/mcp/v1
        docs:
          id: docs
          display_name: Docs
          description: Read and edit Google Docs documents.
          scopes:
            - openid
            - email
            - https://www.googleapis.com/auth/drive.readonly
            - https://www.googleapis.com/auth/drive.file
            - https://www.googleapis.com/auth/documents.readonly
            - https://www.googleapis.com/auth/documents
          mcp_server:
            type: http
            url: https://docsmcp.googleapis.com/mcp/v1
        sheets:
          id: sheets
          display_name: Sheets
          description: Read and edit Google Sheets spreadsheets.
          scopes:
            - openid
            - email
            - https://www.googleapis.com/auth/drive.readonly
            - https://www.googleapis.com/auth/drive.file
            - https://www.googleapis.com/auth/spreadsheets.readonly
            - https://www.googleapis.com/auth/spreadsheets
          mcp_server:
            type: http
            url: https://sheetsmcp.googleapis.com/mcp/v1
        slides:
          id: slides
          display_name: Slides
          description: Read and edit Google Slides presentations.
          scopes:
            - openid
            - email
            - https://www.googleapis.com/auth/drive.readonly
            - https://www.googleapis.com/auth/drive.file
            - https://www.googleapis.com/auth/presentations.readonly
            - https://www.googleapis.com/auth/presentations
          mcp_server:
            type: http
            url: https://slidesmcp.googleapis.com/mcp/v1
        chat:
          id: chat
          display_name: Chat
          description: Read spaces, memberships, and messages; post messages.
          scopes:
            - openid
            - email
            - https://www.googleapis.com/auth/chat.spaces.readonly
            - https://www.googleapis.com/auth/chat.memberships.readonly
            - https://www.googleapis.com/auth/chat.messages.readonly
            - https://www.googleapis.com/auth/chat.messages.create
            - https://www.googleapis.com/auth/chat.users.readstate
          mcp_server:
            type: http
            url: https://chatmcp.googleapis.com/mcp/v1
        people:
          id: people
          display_name: People
          description: Read directory profiles and contacts.
          scopes:
            - openid
            - email
            - https://www.googleapis.com/auth/directory.readonly
            - https://www.googleapis.com/auth/userinfo.profile
            - https://www.googleapis.com/auth/contacts.readonly
          mcp_server:
            type: http
            url: https://people.googleapis.com/mcp/v1
      extra_authorize_params:
        access_type: offline
        prompt: consent
        include_granted_scopes: 'true'
