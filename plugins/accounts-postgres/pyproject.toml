[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tai42-accounts-postgres"
version = "3.0.2"
description = "Postgres-backed accounts provider for the TAI ecosystem: an installable plugin that owns user accounts, password login, sessions, and invites, registers itself as the \"accounts-postgres\" provider, and ships a Studio users-admin UI."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "tai42", email = "oss@tai42.ai" },
]
keywords = ["tai", "accounts", "authentication", "login", "sessions", "postgres", "access-control"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    # The pure interface contract the provider registers through — the accounts
    # ABCs, the login-method metadata models, and the module-level accounts registry.
    # The contract floor is rewritten by scripts/range_sync.py at release.
    "tai42-contract>=13.1,<14",
    # The Postgres and Redis clients plus the session/invite token hash. The
    # `postgres` extra (psycopg[binary,pool]) backs the user/session/invite store;
    # the `redis` extra backs the login rate limiter and the shared bootstrap
    # token. Both are REQUIRED, not optional: the plugin's storage IS Postgres and
    # its throttle IS Redis, so both client modules must resolve for it to import.
    "tai42-kit[postgres,redis]>=5.0,<6",
    # argon2id password hashing (RFC 9106 defaults).
    "argon2-cffi>=23",
]

[project.urls]
Homepage = "https://tai42.ai"
Repository = "https://github.com/tai42ai/tai42/tree/main/plugins/accounts-postgres"
Issues = "https://github.com/tai42ai/tai42/issues"
Changelog = "https://github.com/tai42ai/tai42/blob/main/plugins/accounts-postgres/CHANGELOG.md"

[project.optional-dependencies]
# Public dev/test tooling. No live-Postgres test dependency: the store seam is
# faked in tests, and real-SQL correctness is proven by the ecosystem e2e leg
# against a live database, so this repo needs no pytest-postgresql.
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.389",
    # The plugin-spec test parses tai-plugin.yml.
    "pyyaml>=6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tai42_accounts_postgres*"]

[tool.setuptools.package-data]
# The packaged migration chain (discovered and applied by the shared runner), the
# built Studio bundle (served by the host), and the plugin spec travel in the
# wheel alongside the typing marker.
tai42_accounts_postgres = ["py.typed", "tai-plugin.yml", "migrations/*.sql", "studio/*", "docs/*", "docs/images/*"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }]


# The version floors in [project] are the compatibility contract; these sources
# resolve the tai42-* requirements to the in-tree workspace members instead of
# the published packages. They are not part of wheel metadata.
[tool.uv.sources]
tai42-contract = { workspace = true }
tai42-kit = { workspace = true }
[tool.ruff]
src = ["src"]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "PT", "RUF", "TID", "C901", "PLR0912", "PLR0915", "RET", "PERF", "FURB", "T20", "N", "A", "S", "TRY", "ERA", "D"]
# N815: response models use camelCase field names to match the JSON wire shape.
# TRY003: exception call sites carry rich contextual messages by design.
ignore = ["N815", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C901", "PLR0912", "PLR0915", "RET", "PERF", "FURB", "T20", "D", "TRY", "ERA", "S101", "S102", "S104", "S105", "S106", "S107", "S108", "S112", "S113", "S311", "S324", "S603", "S607", "N801", "N802", "N806", "N814"]
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tai42_skeleton".msg = "tai42-accounts-postgres is a contract-facing plugin: it never imports tai42-skeleton."

[tool.pytest.ini_options]
# importlib import mode + package-less test dirs (no tests/__init__.py): each test
# module loads under a unique path-derived name, so a whole-repo run collecting
# every member's ``tests`` tree never collides on shared basenames. Intra-suite
# helper imports are relative (``from .conftest``), resolving the same under the
# scoped rootdir here and the repo-root rootdir of a whole-repo run.
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: exercises a real external service (e.g. a live Postgres); skips VISIBLY with a clear reason when the service is not configured, never a silent skip",
]

[tool.coverage.run]
source = ["tai42_accounts_postgres"]

[tool.coverage.report]
fail_under = 95

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingImports = "warning"

[tool.ruff.lint.pydocstyle]
convention = "google"
