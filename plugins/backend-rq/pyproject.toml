[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tai42-backend-rq"
version = "2.0.1"
description = "RQ execution backend for the TAI ecosystem — background tool runs and schedules over Redis."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "tai42", email = "oss@tai42.ai" },
]
keywords = ["mcp", "backend", "rq", "redis", "worker", "scheduler", "tai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    # The pure interface contract the backend registers through — the Backend ABC,
    # CallbackSchema fields, the Manifest model, and the tai42_app handle.
    "tai42-contract>=3.0,<5",
    # TaiBaseSettings + settings cache, pooled Redis clients, schedule
    # normalization, and the signature helpers; [jq] compiles the callback
    # condition/expression filters. The floor names the first release carrying
    # `tai42_kit.fork_gate`, the barrier this worker holds around each fork instant
    # (prefork) or in-process job (solo/gevent), and `tai42_kit.backend`
    # (ManagedBackend + BackendDispatchSettings), which this backend builds on.
    "tai42-kit[jq]>=3.5,<4",
    # The broker stack: RQ workers/queues, the recurring-job scheduler (beat),
    # and the web dashboard.
    "rq~=2.7.0",
    "rq-scheduler~=0.14.0",
    "rq-dashboard~=0.8.6",
    # Cooperative green-thread pool for `--pool gevent`.
    "gevent~=25.9.1",
    # Builds the extension branch tools with concrete composed signatures.
    "makefun~=1.16.0",
    # Imported directly: the worker CLI options and the listener thread's
    # dedicated sync connection (also transitive deps of rq itself).
    "click>=8",
    "redis>=5.2.1,<7.0.0",
    # Settings models and the ScheduleRecord round-trip model.
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    # Imported directly by the signature helpers (Context detection when a
    # tool's kwargs are serialized into a queued job).
    "fastmcp>=3.4.7",
]

[project.urls]
Homepage = "https://tai42.ai"
Repository = "https://github.com/tai42ai/tai42/tree/main/plugins/backend-rq"
Issues = "https://github.com/tai42ai/tai42/issues"
Changelog = "https://github.com/tai42ai/tai42/blob/main/plugins/backend-rq/CHANGELOG.md"

[dependency-groups]
# PEP 735 dev group — installed by default on `uv sync`, so the gate
# `uv sync && uv run pytest && uv run ruff check . && uv run pyright` runs clean.
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.389",
    # The plugin-spec test parses tai-plugin.yml.
    "pyyaml>=6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tai42_backend_rq*"]

[tool.setuptools.package-data]
tai42_backend_rq = ["py.typed", "tai-plugin.yml", "docs/*", "docs/images/*"]

[tool.pytest.ini_options]
# importlib import mode + package-less test dirs (no tests/__init__.py): each test
# module loads under a unique path-derived name, so a whole-repo run collecting
# every member's ``tests`` tree never collides on shared basenames. Intra-suite
# helper imports are relative (``from .conftest``), resolving the same under the
# scoped rootdir here and the repo-root rootdir of a whole-repo run.
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
xfail_strict = true
# Turn warnings into errors so a real defect that only surfaces as a warning
# (e.g. a missing await -> "coroutine was never awaited") fails the suite loudly
# instead of passing green.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["tai42_backend_rq"]

[tool.coverage.report]
fail_under = 97

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }]


# The version floors in [project] are the compatibility contract; these sources
# resolve the tai42-* requirements to the in-tree workspace members instead of
# the published packages. They are not part of wheel metadata.
[tool.uv.sources]
tai42-contract = { workspace = true }
tai42-kit = { workspace = true }
[tool.ruff]
src = ["src"]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "PT", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tai42_skeleton".msg = "An execution backend sits below the skeleton: it never imports tai42-skeleton."

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
