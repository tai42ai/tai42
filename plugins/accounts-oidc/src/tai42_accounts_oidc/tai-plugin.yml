spec_version: 1
namespace: tai42
name: accounts-oidc
package: tai42-accounts-oidc
version: 1.0.8
description: >-
  OIDC/OAuth2 login accounts provider for the TAI ecosystem: an installable
  plugin that registers itself as the "accounts-oidc" accounts provider
  (session-based login via an external identity provider, sessions in Redis, SSO
  code hand-back).
license: Apache-2.0
homepage: https://tai42.ai
repository: https://github.com/tai42ai/tai42/tree/main/plugins/accounts-oidc
contract: '>=6.2,<7'
categories:
  - identity
  - security
tags:
  - accounts
  - identity
  - login
  - oidc
  - oauth2
  - sso
  - auth
permissions:
  network: true
  subprocess: false
  filesystem: false
provides:
  - kind: identity
    name: accounts-oidc
    module: tai42_accounts_oidc.provider
    description: >-
      OIDC/OAuth2 login accounts provider — session-based login via an external
      identity provider with SSO code hand-back.
  - kind: router
    name: login
    module: tai42_accounts_oidc.routes
    description: The public /api/login/* login-flow routes.
    routes:
      base: login
      paths:
        - path: /oidc/{provider}/authorize
          methods:
            - GET
          public: true
        - path: /oidc/{provider}/callback
          methods:
            - GET
          public: true
        - path: /sso/exchange
          methods:
            - POST
          public: true
