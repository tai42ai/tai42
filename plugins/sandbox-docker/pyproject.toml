[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tai42-sandbox-docker"
version = "4.1.1"
description = "Docker sandbox provider for the TAI ecosystem — per-session containers on a remote engine over the Docker Engine API."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "tai42", email = "oss@tai42.ai" },
]
keywords = ["mcp", "sandbox", "docker", "container", "execution", "tai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    # The pure interface contract the plugin registers through — the Sandbox ABC,
    # the session models, the SandboxPolicy, the error family, PluginItemKind.SANDBOX,
    # and the tai42_app.sandboxes facet. The floor names the contract minor that
    # first ships the sandbox contract module.
    # The contract floor is rewritten by scripts/range_sync.py at release.
    "tai42-contract>=29.0,<30",
    # TaiBaseSettings + settings cache and the sandbox lifecycle base. The floor
    # names the first kit minor carrying `tai42_kit.sandbox` (ManagedSandbox,
    # ManagedSandboxSession, SandboxDispatchSettings, the conformance suite), which
    # this provider builds on.
    "tai42-kit>=18.0,<19",
    # Pure-python async Docker Engine API client over aiohttp; the provider drives a
    # REMOTE engine through it and spawns no local process. Pinned to a line that
    # ships a py3-none-any wheel (the release lane is wheels-only).
    "aiodocker~=0.27.0",
    # SettingsConfigDict / SecretStr used directly by the settings model.
    "pydantic>=2.12",
    "pydantic-settings>=2.15.0",
]

[project.urls]
Homepage = "https://tai42.ai"
Repository = "https://github.com/tai42ai/tai42/tree/main/plugins/sandbox-docker"
Issues = "https://github.com/tai42ai/tai42/issues"
Changelog = "https://github.com/tai42ai/tai42/blob/main/plugins/sandbox-docker/CHANGELOG.md"

[dependency-groups]
# PEP 735 dev group — installed by default on `uv sync`, so the gate
# `uv sync && uv run pytest && uv run ruff check . && uv run pyright` runs clean.
dev = [
    "pytest>=8",
    # 1.4 runs the exec-attachment suite on each loop factory its conftest names.
    "pytest-asyncio>=1.4",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.389",
    # The plugin-spec test parses tai-plugin.yml.
    "pyyaml>=6",
    # Loopback TLS certificates for the exec-attachment suite's mTLS engine peer.
    "trustme>=1.1",
    # The exec-attachment suite runs on uvloop as well as asyncio.
    "uvloop>=0.22; sys_platform != 'win32'",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tai42_sandbox_docker*"]

[tool.setuptools.package-data]
tai42_sandbox_docker = ["py.typed", "tai-plugin.yml", "docs/*"]

[tool.pytest.ini_options]
# importlib import mode + package-less test dirs (no tests/__init__.py): each test
# module loads under a unique path-derived name, so a whole-repo run collecting
# every member's ``tests`` tree never collides on shared basenames. Intra-suite
# helper imports are relative (``from .conftest``), resolving the same under the
# scoped rootdir here and the repo-root rootdir of a whole-repo run.
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
xfail_strict = true
# Turn warnings into errors so a real defect that only surfaces as a warning
# (e.g. a missing await -> "coroutine was never awaited") fails the suite loudly
# instead of passing green.
filterwarnings = ["error"]
# Each marker gates tests that need more than a bare venv on the host: the
# member's own scoped install, a real Docker engine, or a process namespace of
# their own.
markers = [
    "scoped_install: needs this member's own package-scoped install (uv sync --package <member>); a whole-repo session, whose venv holds every member, skips it",
    "docker: requires a live Docker engine (SANDBOX_DOCKER_TEST_HOST); not run in the unit gate",
    "process_namespace: runs the sandbox exec scripts under a real shell, whose /proc scan must see only the test's own processes, so the tests run in a process namespace of their own (a container); skips VISIBLY with the reason when SANDBOX_DOCKER_PROCESS_NAMESPACE is not set; not run in the unit gate",
]

[tool.coverage.run]
source = ["tai42_sandbox_docker"]

[tool.coverage.report]
# fail_under is compared to the total rounded to `precision` decimals.
fail_under = 97
precision = 2

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }]


# The version floors in [project] are the compatibility contract; these sources
# resolve the tai42-* requirements to the in-tree workspace members instead of
# the published packages. They are not part of wheel metadata.
[tool.uv.sources]
tai42-contract = { workspace = true }
tai42-kit = { workspace = true }
[tool.ruff]
src = ["src"]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "PT", "RUF", "TID", "C901", "PLR0912", "PLR0915", "RET", "PERF", "FURB", "T20", "N", "A", "S", "TRY", "ERA", "D"]
# N815: response models use camelCase field names to match the JSON wire shape.
# TRY003: exception call sites carry rich contextual messages by design.
ignore = ["N815", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C901", "PLR0912", "PLR0915", "RET", "PERF", "FURB", "T20", "D", "TRY", "ERA", "S101", "S102", "S104", "S105", "S106", "S107", "S108", "S112", "S113", "S311", "S324", "S603", "S607", "N801", "N802", "N806", "N814"]
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tai42_skeleton".msg = "A sandbox provider sits below the skeleton: it never imports tai42-skeleton."

[tool.pyright]
include = ["src", "tests"]
# Resolve the in-tree package from the test suite without an editable install, so a
# source-level type check runs before the package is installed at the member gate.
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.ruff.lint.pydocstyle]
convention = "google"
