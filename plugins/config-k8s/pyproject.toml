[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tai42-config-k8s"
version = "1.0.7"
description = "Kubernetes ConfigManager provider plugin for the TAI ecosystem: env via Secrets, manifest via ConfigMaps."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "tai42", email = "oss@tai42.ai" },
]
keywords = ["kubernetes", "k8s", "config", "settings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    # The pure interface contract this provider implements — the ConfigManager ABC.
    # Republished for the tai42-contract 5.x major (unified park protocol).
    "tai42-contract>=5.5,<6",
    # Settings machinery (TaiBaseSettings + settings_cache) and the manifest
    # !ENV-tag yaml utilities (EnvTagLoader / merge_and_dump_manifest).
    "tai42-kit>=3.6,<4",
    # settings.py imports these directly (model_validator + SettingsConfigDict).
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    # Manifest YAML: parse_config (!ENV expansion) + direct yaml load/dump.
    "pyaml-env>=1.2",
    "PyYAML>=6.0",
    # manager.py imports CommentedMap directly for the tag-preserving write merge.
    "ruamel.yaml>=0.18",
]

[project.urls]
Homepage = "https://tai42.ai"
Repository = "https://github.com/tai42ai/tai42/tree/main/plugins/config-k8s"
Issues = "https://github.com/tai42ai/tai42/issues"
Changelog = "https://github.com/tai42ai/tai42/blob/main/plugins/config-k8s/CHANGELOG.md"

[project.optional-dependencies]
# The Kubernetes client is only needed where the k8s provider actually runs;
# K8sConfigManager imports it lazily and raises a copy-pasteable hint if absent.
k8s = ["kubernetes>=28"]

[dependency-groups]
# Public dev/test tooling (installed by default with `uv sync`).
dev = [
    # Reference the [k8s] extra so the kubernetes-client pin has a single source.
    "tai42-config-k8s[k8s]",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.389",
    # The plugin-spec test parses tai-plugin.yml.
    "pyyaml>=6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tai42_config_k8s*"]

[tool.setuptools.package-data]
tai42_config_k8s = ["py.typed", "tai-plugin.yml", "docs/*", "docs/images/*"]

[tool.pytest.ini_options]
# importlib import mode + package-less test dirs (no tests/__init__.py): each test
# module loads under a unique path-derived name, so a whole-repo run collecting
# every member's ``tests`` tree never collides on shared basenames. Intra-suite
# helper imports are relative (``from .conftest``), resolving the same under the
# scoped rootdir here and the repo-root rootdir of a whole-repo run.
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["tai42_config_k8s"]

[tool.coverage.report]
fail_under = 97

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }]


# The version floors in [project] are the compatibility contract; these sources
# resolve the tai42-* requirements to the in-tree workspace members instead of
# the published packages. They are not part of wheel metadata.
[tool.uv.sources]
tai42-contract = { workspace = true }
tai42-kit = { workspace = true }
[tool.ruff]
src = ["src"]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "PT", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tai42_skeleton".msg = "tai42-config-k8s is a provider plugin: it never imports tai42-skeleton."

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
# Basic (not strict) is deliberate: the optional kubernetes / pyaml_env deps ship
# no type stubs, so strict is impractical here (as in tai42-kit). reportMissingImports
# stays a warning so the guarded-optional kubernetes import doesn't fail the check.
typeCheckingMode = "basic"
reportMissingImports = "warning"
