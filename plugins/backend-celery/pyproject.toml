[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tai42-backend-celery"
version = "0.3.1"
description = "Celery execution backend for the TAI ecosystem — worker/beat/flower runtime, prefork-pool turnover on worker-bus ops, and RedBeat scheduling."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "tai42", email = "oss@tai42.ai" },
]
keywords = ["mcp", "celery", "backend", "worker", "redbeat", "scheduling", "tai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    # The pure interface contract — the Backend ABC, CallbackSchema field shape,
    # Manifest, ExtensionKind, and the tai42_app handle the backend registers through.
    "tai42-contract>=0.3,<0.4",
    # TaiBaseSettings + settings cache, pooled Redis client, schedule
    # normalization, signature helpers, and the jq compiler (callback conditions).
    "tai42-kit[jq]>=0.2,<0.3",
    # Celery's own broker/pool machinery and its messaging layer (kombu is
    # Celery's transport library; pinned explicitly to hold the version).
    "celery~=5.6.3",
    "kombu~=5.6.2",
    # RedBeat beat scheduler + its Redis backend.
    "celery-redbeat~=2.3.3",
    "redis>=5.2.1,<7.0.0",
    # Pydantic-aware task argument (de)serialization (CallbackSchema task args).
    "celery-pydantic~=1.0.1",
    # The `flower` launch subcommand (dashboard).
    "flower~=2.0.1",
    # Composed callables for the backend tool extensions.
    "makefun~=1.16.0",
    # Imported directly by core/signatures.py (FastMCP Context detection when
    # composing dispatch-branch signatures; fastmcp is the platform's tool substrate).
    "fastmcp>=3.2",
    # Settings/config model machinery.
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    # ``to_jsonable_python`` for the job payload encoding; imported directly,
    # so declared directly rather than leaned on as a pydantic transitive.
    "pydantic-core>=2",
]

[project.urls]
Homepage = "https://tai42.ai"
Repository = "https://github.com/tai42ai/tai42/tree/main/plugins/backend-celery"
Issues = "https://github.com/tai42ai/tai42/issues"
Changelog = "https://github.com/tai42ai/tai42/blob/main/plugins/backend-celery/CHANGELOG.md"

[dependency-groups]
# PEP 735 dev group — installed by default on `uv sync`, so the gate
# `uv sync && uv run pytest && uv run ruff check . && uv run pyright` runs clean.
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.389",
    # The plugin-spec test parses tai-plugin.yml.
    "pyyaml>=6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tai42_backend_celery*"]

[tool.setuptools.package-data]
tai42_backend_celery = ["py.typed", "tai-plugin.yml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
xfail_strict = true
# Turn warnings into errors so a real defect that only surfaces as a warning
# (e.g. a missing await -> "coroutine was never awaited") fails the suite loudly
# instead of passing green.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["tai42_backend_celery"]

[tool.coverage.report]
fail_under = 97

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }]


# The version floors in [project] are the compatibility contract; these sources
# resolve the tai42-* requirements to the in-tree workspace members instead of
# the published packages. They are not part of wheel metadata.
[tool.uv.sources]
tai42-contract = { workspace = true }
tai42-kit = { workspace = true }
[tool.ruff]
src = ["src"]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "PT", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tai42_skeleton".msg = "An execution backend sits below the skeleton: it never imports tai42-skeleton."

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
