spec_version: 1
namespace: tai42
name: identity-redis
package: tai42-identity-redis
version: 1.0.7
description: >-
  Redis-backed api-key identity provider for the TAI ecosystem: an installable
  plugin that registers itself as the "redis" identity provider (token
  validation plus key provisioning) over plain Redis.
license: Apache-2.0
homepage: https://tai42.ai
repository: https://github.com/tai42ai/tai42/tree/main/plugins/identity-redis
contract: '>=6.0,<7'
categories:
  - identity
  - security
tags:
  - identity
  - api-keys
  - redis
  - auth
permissions:
  network: true
  subprocess: false
  filesystem: false
provides:
  - kind: identity
    name: redis
    module: tai42_identity_redis.redis_api_key_provider
    description: >-
      Redis-backed api-key identity provider — validate inbound tokens and
      provision keys.
