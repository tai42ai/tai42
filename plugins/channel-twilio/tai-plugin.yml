spec_version: 1
namespace: tai42
name: channel-twilio
package: tai42-channel-twilio
version: 5.0.0
description: >-
  Twilio SMS/WhatsApp channel plugin for the TAI ecosystem — delivers ask
  questions to a human's phone and bridges the reply back.
license: Apache-2.0
homepage: https://tai42.ai
repository: https://github.com/tai42ai/tai42/tree/main/plugins/channel-twilio
contract: '>=14.0,<15'
categories:
  - channels
tags:
  - channel
  - twilio
  - sms
  - whatsapp
  - ask
  - hitl
permissions:
  network: true
  subprocess: false
  filesystem: false
provides:
  - kind: channel
    name: twilio
    module: tai42_channel_twilio.register
    description: >-
      Deliver ask questions to a phone over Twilio SMS/WhatsApp and bridge the
      reply back.
    routes:
      base: channels/twilio
      paths:
        - path: /inbound
          methods:
            - POST
          public: true
        - path: /status
          methods:
            - POST
          public: true
