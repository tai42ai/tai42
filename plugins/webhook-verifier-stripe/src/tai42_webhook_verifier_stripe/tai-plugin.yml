  payload is dispatched.
license: Apache-2.0
homepage: https://tai42.ai
repository: https://github.com/tai42ai/tai42/tree/main/plugins/webhook-verifier-stripe
contract: '>=5.9,<6'
categories:
  - webhooks
  - security
tags:
  - webhooks
  - stripe
  - hmac
  - security
permissions:
  network: false
  subprocess: false
  filesystem: false
provides:
  - kind: webhook-verifier
    name: stripe
    module: tai42_webhook_verifier_stripe
    description: Verify a Stripe webhook delivery's Stripe-Signature HMAC before dispatch.
    tags:
      - stripe
      - hmac
