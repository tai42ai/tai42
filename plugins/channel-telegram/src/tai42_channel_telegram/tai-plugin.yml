spec_version: 1
namespace: tai42
name: channel-telegram
package: tai42-channel-telegram
version: 4.0.2
description: >-
  Telegram channel plugin for the TAI ecosystem — delivers ask questions to a
  Telegram chat and bridges the typed reply back to the interactions callback
  door.
license: Apache-2.0
homepage: https://tai42.ai
repository: https://github.com/tai42ai/tai42/tree/main/plugins/channel-telegram
contract: '>=15.0,<16'
categories:
  - channels
tags:
  - channel
  - telegram
  - ask
  - hitl
permissions:
  network: true
  subprocess: false
  filesystem: false
provides:
  - kind: channel
    name: telegram
    module: tai42_channel_telegram.register
    description: Deliver ask questions to a Telegram chat and bridge the typed reply back.
    routes:
      base: channels/telegram
      paths:
        - path: /inbound
          methods:
            - POST
          public: true
