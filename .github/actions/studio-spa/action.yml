name: studio-spa
description: >-
  Set up pnpm + Node and build the Studio SPA (and the @tai42/studio-sdk the
  browser legs link against), then build the checkout's reference plugin bundle
  against that same SDK and install the plugin into the synced venv. Shared by
  the browser build legs.

inputs:
  build:
    description: >-
      Whether to build the SPA. A run against a running stack (TAI_E2E_TARGET set)
      builds no stack and passes "false": only the toolchain is set up.
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      with:
        version: "11.9.0"

    - name: Set up Node 22
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22"

    - name: Build the Studio SPA
      if: inputs.build == 'true'
      shell: bash
      working-directory: tai-studio
      run: |
        pnpm install --frozen-lockfile
        pnpm -r build

    # The studio stack's manifest names the reference plugin (its tools module and
    # its Studio bundle). It is built from the same tai-studio checkout as the SPA,
    # so the bundle targets the host's own STUDIO_PLUGIN_API_VERSION. --no-deps: its
    # one dependency, tai42-contract, is already the workspace's editable package,
    # and resolving it again would replace that with a published wheel.
    - name: Build and install the reference plugin
      if: inputs.build == 'true'
      shell: bash
      run: |
        pnpm --dir tai-studio --filter @tai42/e2e run build:reference-plugin
        uv pip install --python .venv --no-deps ./tai-studio/e2e/reference-plugin
