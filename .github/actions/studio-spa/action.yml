name: studio-spa
description: >-
  Set up pnpm + Node and build the Studio SPA (and the @tai42/studio-sdk the
  browser legs link against). Shared by the browser build legs.

inputs:
  build:
    description: >-
      Whether to build the SPA. A run against a running stack (TAI_E2E_TARGET set)
      builds no stack and passes "false": only the toolchain is set up.
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      with:
        version: "11.9.0"

    - name: Set up Node 22
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22"

    - name: Build the Studio SPA
      if: inputs.build == 'true'
      shell: bash
      working-directory: tai-studio
      run: |
        pnpm install --frozen-lockfile
        pnpm -r build
