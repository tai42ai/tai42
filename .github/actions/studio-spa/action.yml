name: studio-spa
description: >-
  Set up pnpm + Node and build the Studio SPA (and the @tai42/studio-sdk the
  browser legs link against). Shared by the ui and babelfish legs.

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: "11.9.0"

    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Build the Studio SPA
      shell: bash
      working-directory: tai-studio
      run: |
        pnpm install --frozen-lockfile
        pnpm -r build
