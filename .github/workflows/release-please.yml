name: release-please

# release-please runs on every push to main and on manual dispatch, opening or
# updating the release-train PR. The train merges only when its own CI is green
# and its branch is up to date with main (the branch protection of main requires
# both), so the tree that merges is the tree its CI proved. Merging the train
# pushes its merge commit, which re-triggers this workflow to mint the tags;
# release-please is idempotent, so an already-present tag is a no-op. Publish
# lanes fire on the tag push, not on this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release run at a time; never cancel an in-flight release PR update.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the release PR branch; create the tags + GitHub Releases
      pull-requests: write # open and update the release PR
    # A fork without the RELEASE_PLEASE_TOKEN secret skips every step, and with no
    # release PR branch sync-lock skips too.
    env:
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    outputs:
      pr_branch: ${{ steps.release.outputs.pr_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_RELEASE_TOKEN == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.HAS_RELEASE_TOKEN == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/release-please/package-lock.json
      - name: Install release-please
        if: env.HAS_RELEASE_TOKEN == 'true'
        working-directory: scripts/release-please
        run: npm ci
      # The python-workspace plugin asks scripts/range_sync.py which members'
      # ranges the release moves, so the run needs a Python on PATH.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: env.HAS_RELEASE_TOKEN == 'true'
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv python install 3.13
        if: env.HAS_RELEASE_TOKEN == 'true'
      # release-please from the repo's lockfile, the same pin the release-label
      # check projects with: it creates the releases and tags for a merged
      # release PR, then opens or updates the release PR. Manifest mode reads
      # release-please-config.json + .release-please-manifest.json from the
      # target branch through the API; the python-workspace plugin adds a patch
      # release of every member whose first-party ranges or contract pins the
      # release moves, asking range_sync.py over this checkout of that branch.
      # `always-update` rebuilds the open release PR from the target branch's
      # tip on every push to it, even when its notes are unchanged, so sync-lock
      # below always re-derives the ranges over the current tree and the
      # rebuilt train is up to date with main again. The PAT (not GITHUB_TOKEN)
      # is required so the release PR triggers CI and the tags it creates on
      # merge trigger release.yml — refs written by GITHUB_TOKEN do not fire
      # workflows. The token is scoped to this step alone.
      - name: Run release-please
        id: release
        if: env.HAS_RELEASE_TOKEN == 'true'
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 -- node scripts/release-please/run.js --repo-url "$GITHUB_REPOSITORY" --target-branch "$TARGET_BRANCH" > "$RUNNER_TEMP/release.json"
          cat "$RUNNER_TEMP/release.json"
          echo "pr_branch=$(jq -r '.prs[0].headBranchName // empty' "$RUNNER_TEMP/release.json")" >> "$GITHUB_OUTPUT"

  # release-please bumps [project].version in the released members' pyproject.toml
  # but neither the first-party ranges and contract pins those versions move nor
  # the root uv.lock, whose workspace entries still record the old versions. Write
  # the ranges with range_sync.py, then refresh the one root lock on the release
  # branch, so the release PR carries the tree its tags publish. Workspace
  # siblings resolve in-tree, so there is nothing to wait for on the index — no
  # ordering wait. Push with the PAT so CI re-fires on the release PR.
  sync-lock:
    needs: release-please
    if: needs.release-please.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          fetch-depth: 0 # full history so the release-diff detection below can merge-base main
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv python install 3.13
      # The committed frontend bundles embed the project version in their
      # manifests, so a version bump to such a member restales its bundle and
      # reds the drift check on main. Rebuild only the members this release PR
      # actually bumps.
      - name: Detect which frontend-carrying members this release PR bumps
        id: detect
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          changed=$(git diff --name-only origin/main...HEAD)
          dirs=''
          for dir in plugins/channel-web; do
            if grep -qx "$dir/pyproject.toml" <<<"$changed"; then
              echo "$dir pyproject is in this release PR; will rebuild its bundle."
              dirs="$dirs $dir"
            else
              echo "$dir pyproject not in this release PR; skipping its bundle rebuild."
            fi
          done
          dirs=${dirs# }
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          if [ -n "$dirs" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi
      # Every unit whose ranges or contract pins are written below must be one
      # this release PR releases (its version differs from main's), so its
      # published version carries the new ranges. The python-workspace plugin
      # adds those releases from the tree its run checked out; a release branch
      # built on a later main tip can need more, and then this step fails
      # naming each unit and its moves, and the release-please run for that tip
      # rebuilds the branch.
      - name: Check this release releases every unit whose ranges move
        run: uv run --no-project --python 3.13 python scripts/release_train_check.py --base origin/main
      - name: Write first-party ranges and contract pins
        run: uv run --no-project --python 3.13 python scripts/range_sync.py
      - name: Refresh uv.lock
        run: uv lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.detect.outputs.rebuild == 'true'
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.detect.outputs.rebuild == 'true'
        with:
          node-version: 22
      - name: Rebuild the bumped frontend bundles at the release version
        if: steps.detect.outputs.rebuild == 'true'
        env:
          DIRS: ${{ steps.detect.outputs.dirs }}
        run: |
          set -euo pipefail
          for dir in $DIRS; do
            (cd "$dir" && pnpm install --frozen-lockfile && pnpm run build)
          done
      - name: Commit ranges, lockfile and bundle
        env:
          BRANCH: ${{ needs.release-please.outputs.pr_branch }}
          REBUILD: ${{ steps.detect.outputs.rebuild }}
        run: |
          set -euo pipefail
          # Stage the written ranges and pins (core, plugins, e2e), any rebuilt
          # frontend bundle (under plugins/) and the refreshed lock, so they land
          # as one commit on the release PR.
          git add -- core plugins e2e uv.lock
          if git diff --cached --quiet; then
            echo "Release artifacts already in sync; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$REBUILD" = "true" ]; then
            git commit -m "chore: sync ranges, uv.lock and frontend bundles for release"
          else
            git commit -m "chore: sync ranges and uv.lock for release"
          fi
          git push origin "HEAD:$BRANCH"
