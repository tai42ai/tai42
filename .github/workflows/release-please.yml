name: release-please

# release-please runs on every push to main and on manual dispatch, opening or
# updating the release-train PR; that PR's own CI is the merge gate. Merging the
# train pushes its merge commit, which re-triggers this workflow to mint the
# tags; release-please is idempotent, so an already-present tag is a no-op.
# Publish lanes fire on the tag push, not on this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release run at a time; never cancel an in-flight release PR update.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Release automation runs on the org repo only, never in a fork.
    if: github.repository == 'tai42ai/tai42'
    permissions:
      contents: write # push the release PR branch; create the tags + GitHub Releases
      pull-requests: write # open and update the release PR
    outputs:
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # The PAT (not GITHUB_TOKEN) is required so the release PR triggers CI and
      # the tags it creates on merge trigger release.yml — refs written by
      # GITHUB_TOKEN do not fire workflows. Manifest mode is auto-detected from
      # release-please-config.json + .release-please-manifest.json.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # release-please bumps [project].version in the changed members' pyproject.toml
  # but not the root uv.lock, whose workspace entries still record the old
  # versions, so CI's `uv sync --locked` rejects the release PR. Refresh the one
  # root lock on the release branch. Workspace siblings resolve in-tree, so there
  # is nothing to wait for on the index — no ordering wait. Push with the PAT so
  # CI re-fires on the release PR.
  sync-lock:
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          fetch-depth: 0 # full history so the release-diff detection below can merge-base main
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv python install 3.13
      # The committed frontend bundles embed the project version in their
      # manifests, so a version bump to such a member restales its bundle and
      # reds the drift check on main. Rebuild only the members this release PR
      # actually bumps.
      - name: Detect which frontend-carrying members this release PR bumps
        id: detect
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          changed=$(git diff --name-only origin/main...HEAD)
          dirs=''
          for dir in plugins/accounts-postgres plugins/channel-web; do
            if grep -qx "$dir/pyproject.toml" <<<"$changed"; then
              echo "$dir pyproject is in this release PR; will rebuild its bundle."
              dirs="$dirs $dir"
            else
              echo "$dir pyproject not in this release PR; skipping its bundle rebuild."
            fi
          done
          dirs=${dirs# }
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          if [ -n "$dirs" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi
      # First-party tai42-* ranges are NOT re-derived here: a range change squashed
      # into the release merge is unattributed, so the dependent it re-pins never
      # gets a version bump and its published wheel keeps the stale pin. The re-pin
      # lands post-merge as release-repin.yml's `fix(deps)` commit, which the next
      # train attributes to each dependent. A first-party dep is a specifier-less
      # editable workspace entry in the lock, so the deferred range change never
      # touches uv.lock — the only lock staleness on the release PR is the members'
      # own version bumps, which this refresh clears.
      - name: Refresh uv.lock
        run: uv lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.detect.outputs.rebuild == 'true'
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.detect.outputs.rebuild == 'true'
        with:
          node-version: 22
      - name: Rebuild the bumped frontend bundles at the release version
        if: steps.detect.outputs.rebuild == 'true'
        env:
          DIRS: ${{ steps.detect.outputs.dirs }}
        run: |
          set -euo pipefail
          for dir in $DIRS; do
            (cd "$dir" && pnpm install --frozen-lockfile && pnpm run build)
          done
      - name: Commit refreshed lockfile and bundle
        env:
          BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          REBUILD: ${{ steps.detect.outputs.rebuild }}
        run: |
          set -euo pipefail
          # Stage the refreshed lock and any rebuilt frontend bundle (bundles live
          # under plugins/), so versions, bundles, and lock land as one commit on
          # the release PR. Ranges are re-pinned post-merge, not here.
          git add -- plugins
          git add -- uv.lock
          if git diff --cached --quiet; then
            echo "Release artifacts already in sync; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$REBUILD" = "true" ]; then
            git commit -m "chore: sync uv.lock and frontend bundles for release"
          else
            git commit -m "chore: sync uv.lock for release"
          fi
          git push origin "HEAD:$BRANCH"
