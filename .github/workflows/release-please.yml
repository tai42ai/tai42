name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

# One release run at a time; never cancel an in-flight release PR update.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release PR branch; create the tags + GitHub Releases
      pull-requests: write # open and update the release PR
    outputs:
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # The PAT (not GITHUB_TOKEN) is required so the release PR triggers CI and
      # the tags it creates on merge trigger release.yml — refs written by
      # GITHUB_TOKEN do not fire workflows. Manifest mode is auto-detected from
      # release-please-config.json + .release-please-manifest.json.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # release-please bumps [project].version in the changed members' pyproject.toml
  # but not the root uv.lock, whose workspace entries still record the old
  # versions, so CI's `uv sync --locked` rejects the release PR. Refresh the one
  # root lock on the release branch. Workspace siblings resolve in-tree, so there
  # is nothing to wait for on the index — no ordering wait. Push with the PAT so
  # CI re-fires on the release PR.
  sync-lock:
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv python install 3.13
      - name: Configure git auth for the private tai42-marketplace source
        # `uv lock` re-resolves the e2e dev-group's private git source
        # tai42-marketplace. This job runs only on the canonical repo's release
        # PR, so the secret is always present — no fork guard needed.
        env:
          MP_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: git config --global url."https://x-access-token:${MP_TOKEN}@github.com/tai42ai/".insteadOf "https://github.com/tai42ai/"
      - name: Refresh uv.lock
        run: uv lock
      - name: Commit refreshed lockfile
        env:
          BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already in sync; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv.lock for release"
          git push origin "HEAD:$BRANCH"
