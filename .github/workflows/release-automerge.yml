# Release trains open as drafts; a person un-drafts one to release it, which
# fires ready_for_review and arms auto-merge here. Auto-merge merges the train
# once it is up to date with main and green; when release-please rebuilds the
# train after a push to main, the PR stays un-drafted and armed, and merges
# once CI is green on the rebuilt head. The PAT (not GITHUB_TOKEN)
# must both enable auto-merge and author the merge commit: refs written by
# GITHUB_TOKEN fire no workflows, so a GITHUB_TOKEN merge would strand the
# train before its tag ever published.
name: release-automerge

on:
  pull_request:
    types: [ready_for_review]

permissions: {}

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'release-please--') &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Enable auto-merge on the release PR
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
