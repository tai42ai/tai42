name: commitlint

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    # Dependabot's default commit/PR titles are not Conventional Commits; linting
    # them yields a red check that trains people to ignore CI. Its bumps do not
    # need conventional subjects (release-please ignores unparseable commits).
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # amannn reads the PR title
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint walks the PR commit range
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Test the commitlint config
        run: node --test commitlint.config.test.mjs
      - name: Lint commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
      # The PR title becomes the squash subject, so it carries the same
      # markup-angle constraint as commit headers; the pattern and its error
      # text come from the commitlint config.
      - name: Read the PR-title subject constraint
        id: title-constraint
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            import { CONSTRAINT, TITLE_SUBJECT_PATTERN } from "./commitlint.config.mjs";
            appendFileSync(process.env.GITHUB_OUTPUT,
              `pattern=${TITLE_SUBJECT_PATTERN}\nerror=The subject "{subject}" is refused: ${CONSTRAINT}.\n`);
          '
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          subjectPattern: ${{ steps.title-constraint.outputs.pattern }}
          subjectPatternError: ${{ steps.title-constraint.outputs.error }}
