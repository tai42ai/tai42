name: release

on:
  push:
    # Component tags only: tai42-<package>-v<version> (incl. tai42-e2e-v*). A
    # bare v* tag never matches — 32 packages cannot share one bare v* scheme.
    tags: ["tai42-*-v*"]

permissions:
  contents: read

jobs:
  # Builds the tagged package and publishes to PyPI with an API token held as a
  # repository secret. The `pypi` environment scopes that secret to this job.
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history + tags: the API-diff gate loads the package at its previous
        # released tag to classify the surface change.
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv python install 3.13
      - name: Resolve component + assert tag matches pyproject version
        # Parse component/version out of the tag, look the component up as a
        # package-name in release-please-config.json to find its member dir, and
        # assert the built version matches — a stale pyproject can never publish
        # under the wrong tag.
        id: resolve
        run: |
          set -euo pipefail
          component="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          dir=$(python3 -c '
          import json, sys
          component = sys.argv[1]
          config = json.load(open("release-please-config.json"))
          for path, entry in config["packages"].items():
              if entry.get("package-name") == component:
                  print(path); break
          else:
              sys.exit(f"::error::no package-name {component} in release-please-config.json")
          ' "$component")
          pyproject_version=$(python3 -c 'import tomllib,sys; print(tomllib.load(open(sys.argv[1],"rb"))["project"]["version"])' "$dir/pyproject.toml")
          if [ "$version" != "$pyproject_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} version ${version} != ${dir}/pyproject.toml version ${pyproject_version}" >&2
            exit 1
          fi
          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: API-diff gate
        # Label-honesty gate: a breaking public-API change (griffe classification)
        # may not publish under a bump the release label could not have produced.
        # Runs before build so a dishonest release never reaches PyPI.
        run: |
          uv run --locked --only-group api-gate python scripts/api_gate.py \
            --package "${{ steps.resolve.outputs.component }}" \
            --dir "${{ steps.resolve.outputs.dir }}" \
            --version "${{ steps.resolve.outputs.version }}"
      - run: uv build --package "${{ steps.resolve.outputs.component }}" --out-dir dist
      - run: uvx twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Attestations are minted from the OIDC identity token, which token
          # auth does not issue.
          attestations: false

  # Image refresh hook: every published component pokes tai-distribution, whose
  # refresh-pins pipeline re-reads PyPI and rebuilds the platform image when
  # the pinned roster changed. Fork runs carry no token and skip.
  notify-distribution:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DIST_DISPATCH_TOKEN: ${{ secrets.TAI_DIST_DISPATCH_TOKEN }}
    steps:
      - name: Trigger the tai-distribution pin refresh
        if: env.DIST_DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ env.DIST_DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/tai-distribution
          event-type: platform-release
          client-payload: |
            {
              "tag": "${{ github.ref_name }}"
            }
