# Recapture the channel-web media-card docs screenshot.
#
# The channel-web doc page pulls its images from the plugin's own packaged
# `docs/images/` tree, so the media-card shot is a committed plugin asset. On a push
# to `main` that touches the media-card UI source (`plugins/channel-web/public-src/**`),
# this boots a channel stack carrying the web channel, drives a media-card
# notification into a real browser through the plugin's own public doors, screenshots
# the rendered card, and opens a PR if the PNG changed.
#
# Self-contained in this repo (boot + capture + commit-PR all here). Redis/Postgres run
# as service containers, exactly as the e2e suite's own lanes wire them; the capture
# reuses the proven `tai42_e2e` harness. Its capture toolchain — Playwright's Python
# package and trustme for the local https image server — is locked in the e2e member's
# `capture` dependency group and synced from the lock; only Chromium's browser binary is
# out-of-lock, fetched with the system deps a headless browser needs on the runner.

name: channel-web-media-card-screenshot

on:
  push:
    branches: [main]
    paths:
      - 'plugins/channel-web/public-src/**'
      - 'plugins/channel-web/scripts/**'

permissions:
  contents: read

jobs:
  recapture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 20
    env:
      TAI_E2E_REDIS_URL: redis://localhost:6379
      TAI_E2E_PG_HOST: localhost
      TAI_E2E_PG_PASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv python install 3.13
      - name: Sync the locked venv scoped to the e2e harness with its capture toolchain
        # tai42-e2e's dependency closure is the whole deployment (skeleton, the channel
        # plugins, a backend variant); the `capture` group adds the locked capture
        # toolchain — Playwright's Python package and trustme for the local https image
        # server — so the venv carries everything the capture imports and boots.
        run: uv sync --locked --package tai42-e2e --group capture
      - name: Install Playwright's Chromium
        # The Python packages are already in the venv from the locked sync above; only the
        # browser binary is out-of-lock, fetched here with the headless system deps the runner needs.
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Capture the media card
        run: uv run --no-sync python plugins/channel-web/scripts/capture_media_card.py
      - name: Open a PR if the screenshot changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          img=plugins/channel-web/src/tai42_channel_web/docs/images/media-card.png
          if git diff --quiet -- "$img"; then
            echo "media card unchanged; no PR to open"
            exit 0
          fi
          branch="docs/channel-web-media-card-${GITHUB_SHA::12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$img"
          git commit -m "docs(channel-web): refresh the media-card screenshot"
          git push --force-with-lease origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "docs(channel-web): refresh the media-card screenshot" \
            --body "Automated recapture of the channel-web media-card docs screenshot after a change to \`plugins/channel-web/public-src/**\`, regenerated by \`plugins/channel-web/scripts/capture_media_card.py\`."
