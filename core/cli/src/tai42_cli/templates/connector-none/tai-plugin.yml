spec_version: 1
namespace: acme
name: __PLUGIN_NAME__
version: 0.0.0
display_name: Acme
description: No-auth connector provider for Acme.
icon: https://example.invalid/icon.png
license: Apache-2.0
homepage: https://example.invalid
repository: https://example.invalid
contract: '>=2,<3'
categories: [connectors]
tags: [connector]
permissions: {network: false, subprocess: false, filesystem: false}
provides:
  - kind: connector
    # The connector item name MUST equal provider.id below (the manifest and
    # uninstall key). Rename both together.
    name: acme
    description: No-auth connector for Acme.
    provider:
      id: acme
      # ``none`` = no OAuth dance; the client supplies static config values.
      kind: none
      # ``system`` is reserved for the tai42 namespace; a community listing is
      # ``community``. Keep this in step with the ``namespace`` above.
      origin: community
      category: communication
      display_name: Acme
      description: Connect your Acme account with a static token.
      icon_url: https://example.invalid/icon.png
      # ``target`` MUST match the sub-service transport channel: ``header`` for an
      # http/websocket MCP server, ``env`` for a stdio one.
      config_fields:
        - key: api_token
          label: API token
          target: header
          required: true
          secret: true
      sub_services:
        acme:
          id: acme
          display_name: Acme
          description: Sample Acme sub-service on a hosted MCP server.
          mcp_server:
            type: http
            url: https://example.invalid/mcp
