[tool.uv.workspace]
members = ["core/*", "plugins/*", "e2e"]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6", "packaging>=24"]  # root fleet test only
api-gate = ["griffe>=2.1,<3", "pyyaml>=6"]  # scripts/api_gate.py release gate

# Lint config for the root-level scripts/ and tests/ — the only Python here not
# owned by a workspace member. Mirrors every member's ruff regime; src marks the
# conftest-injected scripts/ modules as first-party.
[tool.ruff]
src = ["scripts"]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "PT", "RUF", "TID"]
