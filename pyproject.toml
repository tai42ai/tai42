[tool.uv.workspace]
members = ["core/*", "plugins/*", "e2e"]
# The connector plugins are descriptor-only dirs (tai-plugin.yml, no pyproject):
# they carry no package, so uv would error on them as workspace members.
exclude = [
    "plugins/connector-google",
    "plugins/connector-atlassian",
    "plugins/connector-slack",
    "plugins/connector-github",
]

[dependency-groups]
# The whole-repo test closure: the root fleet tests (scripts/, tests/) plus the
# cross-package test deps that a single ``uv sync --all-packages`` must carry so
# every member's suite collects. ``fakeredis[lua]`` backs the skeleton's Redis
# suites and ``trustme`` the toolbox HTTPS-proxy path; each member also keeps its
# own copy in ``[project.optional-dependencies].dev`` for the scoped
# ``--package <member> --extra dev`` CI leg.
dev = ["pytest>=8", "pyyaml>=6", "packaging>=24", "fakeredis[lua]>=2.21", "trustme>=1.1"]
api-gate = ["griffe>=2.1,<3", "pyyaml>=6"]  # scripts/api_gate.py release gate

# Lint config for the root-level scripts/ and tests/ — the only Python here not
# owned by a workspace member. Mirrors every member's ruff regime; src marks the
# conftest-injected scripts/ modules as first-party.
# Whole-repo pytest config. Present so a bare ``pytest`` at the repo root anchors
# its rootdir here and collects every member's ``tests`` tree in one session.
# importlib import mode + the package-less test dirs (no tests/__init__.py) give
# each test module a unique path-derived name, so shared basenames across members
# (test_channel.py, conftest.py, ...) never collide. Scoped runs still resolve
# their own member pyproject as rootdir and are unaffected by this block.
[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"

[tool.ruff]
src = ["scripts"]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "PT", "RUF", "TID"]
